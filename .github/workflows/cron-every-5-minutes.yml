name: Cron Job - Every 5 Minutes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  cron-job:
    runs-on: ubuntu-latest

    steps:
      - name: Job Started
        run: echo "Cron job started!"

      - name: Display Current Date and Time
        run: date

      - name: Job Completed
        run: echo "Cron job completed successfully!"
