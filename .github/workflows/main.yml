name: GitHub Actions Demo

on:
  push:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display current directory
        run: pwd

      - name: List files
        run: ls -la

      - name: Show date
        run: date

      - name: Create a text file
        run: |
          echo "Hello from GitHub Actions!" > output.txt
          echo "This file was created by the GitHub Actions workflow." >> output.txt

      - name: Display text file
        run: cat output.txt

      - name: Run simple Python program
        run: |
          python3 -c "print('Hello from Python program!')"
